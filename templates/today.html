<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · Tracker</title><!-- the same at night too: tile-windows finds the pinned window by this title -->
<style>
  /* The tracker's colours; one narrow column, made to sit open beside other windows all day. */
  :root {
    --bg: #14161a; --panel: #1d2027; --panel2: #23272f;
    --line: #313743; --text: #e6e9ef; --muted: #8b93a3;
    --accent: #6ea8fe; --danger: #e06c75;
    --w1:#e06c75; --w2:#e5a15a; --w3:#e5d15a; --w4:#7fb069; --w5:#6b7280;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0 auto; max-width: 620px; padding: 12px 10px 20px; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .date { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  h1 { font-size: 19px; line-height: 1.3; margin: 4px 0 8px; font-weight: 650; text-wrap: balance; }
  .progress { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px;
              font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .stale { margin-top: 8px; font-size: 13px; color: var(--w2); }
  h2 { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
       margin: 16px 0 5px; font-weight: 600; }
  .item { display: flex; gap: 9px; align-items: flex-start; padding: 7px 9px; margin-bottom: 5px;
          background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; }
  .item[data-w="1"] { border-left-color: var(--w1); }
  .item[data-w="2"] { border-left-color: var(--w2); }
  .item[data-w="3"] { border-left-color: var(--w3); }
  .item[data-w="4"] { border-left-color: var(--w4); }
  .item[data-w="5"] { border-left-color: var(--w5); }
  .tick { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--accent); cursor: pointer; }
  .tick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .it { min-width: 0; flex: 1; }
  .t { font-weight: 600; word-wrap: break-word; }
  .why { color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 1px; word-wrap: break-word; }
  .proj { color: var(--accent); opacity: .8; font-size: 12px; margin-left: 4px; white-space: nowrap; }
  .item.done .t { color: var(--muted); text-decoration: line-through; }
  .item.done .why, .item.done details { opacity: .55; }
  details { margin-top: 2px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 11.5px; opacity: .8; }
  details div { margin-top: 4px; color: var(--muted); white-space: pre-wrap; word-wrap: break-word;
                border-left: 2px solid var(--line); padding-left: 8px; }
  .later { flex: none; margin: 0; padding: 1px 7px; font: inherit; font-size: 12px; color: var(--muted);
           background: none; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .later:hover, .later:focus-visible { color: var(--text); border-color: var(--muted); }
  .item.done .later { display: none; }
  a.later { text-decoration: none; }
  .picker { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 6px; font-size: 12.5px; }
  .picker span { color: var(--muted); }
  .picker button, .picker input { font: inherit; padding: 2px 7px; color: var(--text); background: var(--panel2);
                                  border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .picker input { color-scheme: dark; cursor: text; }
  .picker button:hover { border-color: var(--accent); }
  .picker .cancel { background: none; color: var(--muted); }
  .notice { margin-top: 8px; padding: 6px 9px; font-size: 13px; background: var(--panel2); border-radius: 8px; }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { margin-top: 18px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
<link rel="icon" href="/static/icon-192.png">
<script src="/static/claude.js"></script>
</head>
<body>
  <div class="date" id="date">Today</div>
  <h1 id="headline"></h1>
  <div class="progress" id="progress" hidden><div class="bar"><i id="fill"></i></div><span id="count"></span></div>
  <div class="stale" id="stale" hidden></div>
  <div class="notice" id="notice" role="status" hidden></div>
  <div id="list"><div class="empty">Loading…</div></div>
  <footer><a href="/" target="_blank" rel="noopener">All notes</a><span id="updated"></span></footer>

<script>
const el = s => document.querySelector(s);
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function localDay(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dayLabel(day) {
  const [y, m, d] = day.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString([], {weekday: "long", month: "short", day: "numeric"});
}

// Redraws only when something changed, and never while a tick is on its
// way, so the list doesn't jump under the mouse.
// A tick bumps gen, so an answer to a check that started before it is
// dropped instead of drawing the box back the way it was.
let shown = "", busy = 0, gen = 0, current = null;
async function load() {
  if (busy) return;
  const mine = gen;
  let res;
  try { res = await (await fetch("/api/today", {cache: "no-store"})).json(); }
  catch (e) { el("#updated").textContent = "Can't reach the tracker; trying again"; return; }
  if (busy || mine !== gen) return;
  const key = JSON.stringify(res);
  if (key !== shown) { shown = key; render(res); }
  staleLine(res);  // every check, so a window left open past midnight says so
  el("#updated").textContent = "Checked " + new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}

function render(res) {
  const list = el("#list");
  if (!res.day) {
    el("#headline").textContent = "No list yet";
    list.innerHTML = `<div class="empty">The first one arrives at 4 AM, picked from the tracker.</div>`;
    return;
  }
  current = res;
  if (closePicker) closePicker();  // its row is about to go
  el("#date").textContent = dayLabel(res.day) + (res.slot !== "day" ? ` · ${res.label}` : "");
  el("#headline").textContent = res.headline || `${res.label}'s list`;
  list.innerHTML = "";
  res.sections.forEach(sec => {
    const h = document.createElement("h2");
    h.textContent = sec.label;
    list.appendChild(h);
    sec.items.forEach(n => list.appendChild(itemEl(n)));
  });
  if (!res.sections.length) list.innerHTML = `<div class="empty">Nothing on this list.</div>`;
  count();
}

// A night's list is still tonight's until the morning's arrives at 4.
function staleLine(res) {
  const now = new Date();
  const current = res.slot === "night" && now.getHours() < 4 ? localDay(new Date(now - 864e5)) : localDay(now);
  const stale = !!res.day && res.day !== current;
  el("#stale").hidden = !stale;
  if (stale) el("#stale").textContent =
    `This is ${dayLabel(res.day)}${res.slot !== "day" ? ` ${res.slot}` : ""}'s list. Today's arrives at 4 AM.`;
}

function itemEl(n) {
  const d = document.createElement("div");
  d.className = "item" + (n.done_at ? " done" : "");
  d.dataset.w = n.when_tag ? n.when_tag[0] : "";
  const proj = n.what.length ? `<span class="proj">${escapeHtml(n.what.join(", "))}</span>` : "";
  d.innerHTML = `
    <input type="checkbox" class="tick" ${n.done_at ? "checked" : ""} aria-label="Done: ${escapeHtml(n.title)}">
    <div class="it">
      <div class="t">${escapeHtml(n.title)}${proj}</div>
      ${n.why ? `<div class="why">${escapeHtml(n.why)}</div>` : ""}
      ${n.details ? `<details><summary>Details</summary><div>${escapeHtml(n.details)}</div></details>` : ""}
    </div>
    ${CLAUDE_HERE ? `<a class="later claude" title="Open a Claude session about this, with it typed in"
                       aria-label="Ask Claude: ${escapeHtml(n.title)}">Claude</a>` : ""}
    <button type="button" class="later" aria-label="Put off: ${escapeHtml(n.title)}">Later</button>`;
  const box = d.querySelector(".tick");
  box.onchange = () => setDone(n.id, box.checked, d, box);
  d.querySelector("button.later").onclick = () => picker(n, d);
  const link = CLAUDE_HERE && claudeLink(n);
  if (link) d.querySelector(".claude").href = link;
  else if (CLAUDE_HERE) d.querySelector(".claude").remove();
  return d;
}

// Later: pick a day, and the tracker dates the note (it comes back that
// morning) and puts another one in its place. The list holds still while the
// choices are open.
function addDays(k) { const d = new Date(); d.setDate(d.getDate() + k); return localDay(d); }
function shortDay(day) {
  const [y, m, d] = day.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"});
}
let closePicker = null;  // one open at a time, so a redraw never strands one holding the list still
function picker(n, row) {
  if (row.querySelector(".picker")) return;
  if (closePicker) closePicker();
  busy++;
  const p = document.createElement("div");
  p.className = "picker";
  const min = [addDays(1), (() => { const [y, m, d] = current.day.split("-").map(Number);
    return localDay(new Date(y, m - 1, d + 1)); })()].sort()[1];
  const choice = k => { const day = addDays(k) < min ? min : addDays(k);  // never on or before the list's day
    return `<button type="button" data-day="${day}">${day === addDays(1) ? "Tomorrow" : shortDay(day)}</button>`; };
  p.innerHTML = `<span>Put off to</span> ${choice(1)} ${choice(7)} ${choice(14)}
    <input type="date" min="${min}" aria-label="Another day">
    <button type="button" class="cancel">Cancel</button>`;
  let open = true;
  const close = () => { if (open) { open = false; p.remove(); busy--; closePicker = null; } };
  closePicker = close;
  p.querySelectorAll("button[data-day]").forEach(b => b.onclick = () => { close(); defer(n, b.dataset.day); });
  const input = p.querySelector("input");
  input.onchange = () => {
    if (input.value >= min) { close(); defer(n, input.value); }
    else if (input.value) { input.value = ""; alert(`Pick ${shortDay(min)} or later.`); }
  };
  p.querySelector(".cancel").onclick = close;
  row.querySelector(".it").appendChild(p);
  p.querySelector("button").focus();
}
async function defer(n, day) {
  busy++; gen++;
  const url = `/api/today/${current.day}${current.slot !== "day" ? `/${current.slot}` : ""}/defer`;
  let res = null, why = "Check the connection.";
  try {
    const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({note_id: n.id, on_day: day})});
    if (r.ok) res = await r.json();
    else why = (await r.json().catch(() => ({}))).error || `The tracker answered ${r.status}.`;
  } catch (e) { res = null; }
  busy--;
  // the list may have changed under the page (the 4 AM one arrived): the next check redraws it
  if (!res) { shown = ""; alert(`Couldn't put that off. ${why}`); return; }
  shown = JSON.stringify(res.list); render(res.list);
  const notice = el("#notice");
  notice.textContent = `“${n.title}” comes back ${shortDay(day)}. ` + (res.stand_in
    ? `In its place: ${res.stand_in.body}.` : "Nothing else fit, so the list is one shorter.");
  notice.hidden = false;
  clearTimeout(defer.t); defer.t = setTimeout(() => { notice.hidden = true; }, 20000);
}

// Ticks the note itself, so it's ticked in the tracker too.
async function setDone(id, done, row, box) {
  busy++; gen++;
  row.classList.toggle("done", done); count();
  let ok = false;
  try {
    ok = (await fetch(`/api/notes/${encodeURIComponent(id)}`, {method: "PUT",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({done})})).ok;
  } catch (e) { ok = false; }
  busy--;
  if (!ok) { row.classList.toggle("done", !done); box.checked = !done; count(); alert("Couldn't save that. Check the connection."); }
  shown = "";  // the next check redraws from what the tracker holds
}

function count() {
  const all = document.querySelectorAll(".item").length, done = document.querySelectorAll(".item.done").length;
  el("#progress").hidden = !all;
  el("#count").textContent = `${done} of ${all} done`;
  el("#fill").style.width = all ? `${100 * done / all}%` : "0";
}

load();
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
window.addEventListener("focus", load);
</script>
</body>
</html>
